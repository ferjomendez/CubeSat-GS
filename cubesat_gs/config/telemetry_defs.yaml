    - {name: cmd_counter, type: uint8}
    - {name: err_counter, type: uint8}

apid_103:
  name: "OBC Info"
  byte_order: little
  secondary_header: cfs_tlm
  fields:
    - {name: cpu_temp, type: float32, unit: "°C"}
    - {name: ram_usage_percent, type: float32, unit: "%"}
    - {name: ram_usage, type: int32}
    - {name: cpu_usage, type: float32, unit: "%"}

apid_104:
